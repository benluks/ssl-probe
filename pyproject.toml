[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-probe"
version = "0.1.0"
description = "Probe speech representations for frame-level acoustic and paralinguistic attributes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightning>=2.6.5",
    "numpy>=1.26",
    "opensmile>=2.6.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "quick-convert[training,transformers] @ git+https://github.com/benluks/quick-convert.git",
    "scipy>=1.17.1",
    "torch==2.6",
    "torchaudio==2.6",
    "torchmetrics>=1.9.0",
    "tqdm",
    "wandb>=0.28.1",
]

[project.urls]
Repository = "https://github.com/benluks/ssl-probe"

[project.scripts]
ssl-probe = "ssl_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ssl_probe*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]
model-test = [
    "s3tokenizer>=0.3.0",
]

[tool.pytest.ini_options]
markers = [
    "model: downloads and runs external speech models",
]

[tool.ruff]
target-version = "py311"
line-length = 100
