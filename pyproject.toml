[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-probe"
version = "0.1.0"
description = "Probe speech representations for frame-level acoustic and paralinguistic attributes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightning>=2.6.5",
    "opensmile>=2.6.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "quick-convert[training,transformers]",
    "scipy>=1.17.1",
    "torchmetrics>=1.9.0",
    "wandb>=0.28.1",
]

[project.scripts]
ssl-probe = "ssl_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ssl_probe*"]

[tool.uv.sources]
quick-convert = { git = "https://github.com/benluks/quick-convert.git" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py311"
line-length = 100
